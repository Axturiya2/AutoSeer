# NOTE: jdk.net.unixdomain.tmpdir must point at a short, ASCII path (no 8.3
# names like ADMINI~1) or the JBR's AF_UNIX-based NIO pipe fails with EINVAL
# ("Unable to establish loopback connection") on this machine.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=D:\\BY\\tmp
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
